name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iPadLauncher-apk
          path: build/iPadLauncher.apk
